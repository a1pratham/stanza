name: stanza
description: "AI-powered swipe-based news application"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # PHASE 4: the only new dependency. Official Supabase client for Flutter,
  # used by lib/services/stanza_repository.dart to query the live pipeline.
  # It needs no backend changes: it reads with the public anon key against
  # the read-only RLS policies already created in Phase 2/3.
  supabase_flutter: ^2.17.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
