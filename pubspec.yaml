name: stanza
description: "AI-powered swipe-based news application"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.17.2
  shared_preferences: ^2.3.3

  # UI redesign: serif headlines (Source Serif 4) + sans body (Figtree)
  google_fonts: ^6.2.1

  # PHASE 6: real in-app browser (Chrome Custom Tabs / SFSafariViewController)
  url_launcher: ^6.3.1
  # PHASE 6: real platform share sheet
  share_plus: ^13.2.1
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  google_sign_in: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
